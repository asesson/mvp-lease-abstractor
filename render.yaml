services:
  # Web Service - Next.js Application
  - type: web
    name: lease-abstractor
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
    disk:
      name: lease-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 10

# Databases section removed - using existing Neon database
# Set DATABASE_URL manually in Render dashboard to your Neon connection string
