services:
  # Web Service - Next.js Application
  - type: web
    name: lease-abstractor
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: lease-abstractor-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
    disk:
      name: lease-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 10

databases:
  # PostgreSQL Database
  - name: lease-abstractor-db
    databaseName: lease_abstractor
    plan: starter
    region: oregon
